<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Classification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Pitch black background */
            color: #ffffff; /* Light text color */
            display: flex;
            flex-direction: column;
            align-items: center; /* Center horizontally */
            justify-content: center; /* Center vertically */
            height: 100vh; /* Full viewport height */
            overflow: hidden; /* Prevent scrollbars */
        }
        #main-title {
            text-align: center;
            font-size: 80px; /* Title size */
            margin-bottom: 10px; /* Space below title */
            color: #FFFFFF;
            position: relative; /* Make it position relative */
            z-index: 2; /* Higher z-index to ensure it is above the shapes */
        }
        #sub-text {
            text-align: center;
            font-size: 38px; /* Subtitle size */
            color: #FFFEEE; /* Light gray color for subtitle */
            position: relative; /* Make it position relative */
            z-index: 2; /* Higher z-index to ensure it is above the shapes */
        }
        /* Hamburger menu styles */
        #hamburger-menu {
            position: fixed;
            top: 40px; /* Position at the top left */
            left: 40px; /* Position at the left */
            background: transparent; /* Transparent background */
            border: none; /* No border */
            color: white; /* Text color */
            cursor: pointer; /* Pointer cursor */
            z-index: 1000; /* Ensure it's above other elements */
            font-size: 50px; /* Size of the hamburger icon */
        }
        #hamburger-menu:focus {
            outline: none; /* Remove focus outline */
        }

        /* Side Navigation Pane */
        #side-nav {
            display: none; /* Initially hidden */
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 250px; /* Width of the side navigation */
            background: #444; /* Darker menu background */
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
            z-index: 1000; /* Ensure it appears above other elements */
            padding: 20px; /* Padding around the menu */
        }
        #side-nav a {
            display: block; /* Make links stack */
            padding: 10px;
            color: #ffffff; /* Light text color */
            text-decoration: none; /* Remove underline */
        }
        #side-nav a:hover {
            background: #007bff; /* Highlight on hover */
        }
        #close-nav {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px; /* Close icon size */
        }

        /* Upload Section Styles */
        #upload-section {
            text-align: center;
            margin-top: 20px; /* Space above upload section */
        }
        input[type="file"] {
            padding: 10px;
            margin: 10px 0;
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
        }
        select {
            padding: 10px;
            margin: 10px 0;
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
        }
        button[type="submit"] {
            padding: 10px 20px;
            background-color: #5cb85c; /* Green background */
            border: none; /* No border */
            color: white; /* White text */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Pointer cursor */
            margin-top: 10px; /* Space above the button */
        }
        button[type="submit"]:hover {
            background-color: #4cae4c; /* Darker green on hover */
        }
    </style>
</head>
<body>

<div id="main-title">Document Classification</div>
<div id="sub-text">Classifying Your Documents with Ease</div>

<!-- Upload Section -->
<div id="upload-section">
    <h2>Upload Your Document</h2>
    <input type="file" id="file-upload" accept=".pdf,.docx,.jpg,.png" required>
    
    <h3>Select Format</h3>
    <select id="format-selection" required>
        <option value="" disabled selected>Select format</option>
        <option value="pdf">PDF</option>
        <option value="docx">Word Document</option>
        <option value="txt">Text File</option>
    </select>
    
    <button type="submit" onclick="handleUpload()">Upload</button>
</div>

<!-- Hamburger Menu -->
<button id="hamburger-menu">☰</button>

<!-- Side Navigation Pane -->
<div id="side-nav">
    <button id="close-nav">✖</button>
    <a href="webpage.html">Home</a>
    <a href="OCR.html">OCR Based Text Extraction</a>
    <a href="NER.html">Named Entity Recognition</a>
    <a href="DocClass.html">Document Classification</a>
    <a href="DocDig.html">Document Digitalization</a>
</div>

<script>
    // Hamburger Menu Functionality
    const hamburgerMenu = document.getElementById('hamburger-menu');
    const sideNav = document.getElementById('side-nav');
    const closeNav = document.getElementById('close-nav');

    hamburgerMenu.onclick = () => {
        sideNav.style.display = 'block'; // Show the side navigation
    };

    closeNav.onclick = () => {
        sideNav.style.display = 'none'; // Hide the side navigation
    };

    // Handle Upload Functionality
    function handleUpload() {
        const fileInput = document.getElementById('file-upload');
        const formatSelection = document.getElementById('format-selection');

        if (fileInput.files.length === 0 || formatSelection.value === "") {
            alert("Please select a file and a format!");
        } else {
            const fileName = fileInput.files[0].name;
            const format = formatSelection.value;

            // Process the upload here (this part is just an alert for demonstration)
            alert(`Uploading ${fileName} as ${format.toUpperCase()}...`);
        }
    }
</script>

</body>
</html>
